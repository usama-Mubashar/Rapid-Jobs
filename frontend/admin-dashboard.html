<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <h1 class="logo">RapidJobs</h1>
      
      <nav>
        
       <a href="post-job.html">Post Job</a>
       <a href="admin-candidates.html">Candidates Applied</a>
        <a href="admin-dashboard.html" class="active">Admin</a>

          <p>80</p>
        </div>
      </div>

      <h3 class="section-title">Recent Job Posts</h3>
      <table id="jobsTable">
        
      </table>
    </div>
  </section>

  <footer>
    <p>© 2025 RapidJobs | Designed for Project Task</p>
  </footer>
<script src="./js/admin-dashboard.js"></script>

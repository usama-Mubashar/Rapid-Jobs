<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | RapidJobs</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container">
      <h1 class="logo">RapidJobs</h1>
      <nav>
         <a href="index.html" class="active">Home</a>
    <a href="jobs.html">Jobs</a>
   
    
    
    <a href="upload-resume.html">Upload Resume</a>
     <a href="login.html" id="loginLink">Login</a>
    <span id="userInfo" style="display: none;">
      Welcome, <b id="userName"></b> |
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </span>
        
      </nav>
    </div>
  </header>

  <!-- Register Form -->
  <section class="form-section">
    <div class="form-box">
      <h2>Create an Account</h2>
      <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password"id="password" placeholder="Create a password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmpassword" placeholder="Confirm your password" required>

        <button type="submit">Register</button>
         
        <p class="redirect">Already have an account? <a href="login.html">Login here</a></p>
        <div id="messageBox" class="message-box"></div>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 RapidJobs | Designed for Project Task</p>
  </footer>


  <script src="./js/register.js"></script>

</body>


</html>
